[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dime-bench"
dynamic = ["version"]
description = "Mechanism-aware evaluation for discrete diffusion language models"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
  {name = "DiME-Bench Authors"},
]
keywords = [
  "benchmark",
  "diffusion-language-model",
  "language-model-evaluation",
  "dLLM",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# Kept as a compatibility alias for the documented ``.[core]`` install command.
core = []
hf = [
  "accelerate>=0.34,<2",
  "datasets>=2.20,<5",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "torch>=2.3,<3",
  "transformers>=4.45,<5",
]
diffusion = [
  "accelerate>=0.34,<2",
  "safetensors>=0.4,<1",
  "torch>=2.3,<3",
  "transformers>=4.45,<5",
]
metrics = [
  "bert-score>=0.3.13,<1",
  "numpy>=1.26,<3",
  "rouge-score>=0.1.2,<1",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]
code = [
  "pytest>=8,<9",
  "pytest-timeout>=2.3,<3",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.11,<2",
  "pydantic>=2.8,<3",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "PyYAML>=6.0,<7",
  "ruff>=0.6,<1",
  "twine>=5,<7",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
dimebench = "dimebench.cli.main:main"

[project.urls]
Documentation = "https://github.com/DiME-Bench/DiME-Bench#readme"
Issues = "https://github.com/DiME-Bench/DiME-Bench/issues"
Repository = "https://github.com/DiME-Bench/DiME-Bench"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dimebench*"]

[tool.setuptools.data-files]
"share/dimebench/data" = ["data/registry.yaml"]
"share/dimebench/data/manifests" = ["data/manifests/*.yaml"]
"share/dimebench/data/cards" = ["data/cards/*.md"]
"share/dimebench/data/samples" = ["data/samples/*.jsonl"]
"share/dimebench/specification" = ["specification/*.json"]
"share/dimebench/docs/getting-started" = ["docs/getting-started/*.md"]
"share/dimebench/docs/concepts" = ["docs/concepts/*.md"]
"share/dimebench/docs/tracks" = ["docs/tracks/*.md"]
"share/dimebench/docs/guides" = ["docs/guides/*.md"]
"share/dimebench/docs/reproduction" = ["docs/reproduction/*.md"]
"share/dimebench/configs/models/autoregressive" = ["configs/models/autoregressive/*.yaml"]
"share/dimebench/configs/models/diffusion" = ["configs/models/diffusion/*.yaml"]
"share/dimebench/configs/experiments" = ["configs/experiments/*.yaml"]
"share/dimebench/configs" = ["configs/*.yaml"]
"share/dimebench/configs/experiments/aaai2027" = ["configs/experiments/aaai2027/*.yaml"]
"share/dimebench/configs/runtime" = ["configs/runtime/*.yaml"]
"share/dimebench/configs/tasks/track1_general" = ["configs/tasks/track1_general/*.yaml"]
"share/dimebench/configs/tasks/track2_infilling" = ["configs/tasks/track2_infilling/*.yaml"]
"share/dimebench/configs/tasks/track3_editing" = ["configs/tasks/track3_editing/*.yaml"]
"share/dimebench/configs/tasks/track4_reasoning" = ["configs/tasks/track4_reasoning/*.yaml"]

[tool.setuptools.package-data]
"dimebench.prompts" = [
  "track1/*.yaml",
  "track2/*.yaml",
  "track3/*.yaml",
  "track4/*.yaml",
]

[tool.setuptools.dynamic]
version = {attr = "dimebench.version.__version__"}

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "gpu: requires CUDA and real model weights; skipped unless explicitly enabled",
  "golden: deterministic metric fixtures with frozen expected outputs",
  "smoke: fast CPU-only end-to-end acceptance tests",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["dimebench", "scripts"]
