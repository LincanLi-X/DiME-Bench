track: track6_efficiency
description: "Track 6: efficiency, parallelism, and decoding behavior."
models:
  - configs/models/dllm/llada_8b.yaml
  - configs/models/dllm/llada_1_5.yaml
  - configs/models/dllm/dream_7b.yaml
  - configs/models/dllm/diffusellama_7b.yaml
  - name: SEDD
    family: dllm
    repo_id: louaaron/sedd-small
    local_dir: models/checkpoints/dllm/SEDD
    trust_remote_code: true
    loader: auto
    dtype: bfloat16
    device_map: auto
    use_chat_template: false
    requires_auth: false
    default_max_new_tokens: 512
    notes: "Inline Track 6 config; add shared configs/models/dllm/sedd.yaml later if adopted globally."
  - configs/models/ar/llama3_8b_instruct.yaml
  - configs/models/ar/gpt2_xl.yaml
datasets:
  cnn_dailymail_infilling:
    task_type: infilling
    metric: token_f1
    prompt_template: prompts/track6_efficiency/infilling.txt
    upstream_paths:
      - data/processed/track2_infilling/cnn_dailymail/samples.jsonl
      - data/processed/track2_infilling/cnn_dailymail_paragraph/samples.jsonl
      - data/processed/track2_infilling/**/samples.jsonl
    sample_threshold: 380
    sample_size: 200
    sample_seed: 42
    max_new_tokens: 512
  synthetic_contradiction_repair:
    task_type: repair
    metric: repair_score
    prompt_template: prompts/track6_efficiency/repair.txt
    upstream_paths:
      - data/processed/track3_editing/synthetic_contradiction_repair/samples.jsonl
      - data/processed/track3_editing/contradiction_repair/samples.jsonl
      - data/processed/track3_editing/**/samples.jsonl
    sample_threshold: 380
    sample_size: 200
    sample_seed: 42
    max_new_tokens: 512
  json_schema_generation:
    task_type: json_schema
    metric: json_schema_score
    prompt_template: prompts/track6_efficiency/json_schema.txt
    upstream_paths:
      - data/processed/track5_constraints/json_schema_generation/samples.jsonl
      - data/processed/track5_constraints/json_schema/samples.jsonl
    sample_threshold: 380
    sample_size: 200
    sample_seed: 42
    max_new_tokens: 512
  fixed_length:
    task_type: fixed_length
    metric: length_adherence
    prompt_template: prompts/track6_efficiency/fixed_length.txt
    target_lengths: [128, 512, 1024]
    sample_size: 12
    sample_seed: 42
    max_new_tokens: 1024
generation:
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  batch_size: 8
  default_max_new_tokens: 512
  dllm_default_steps: 64
  max_input_tokens: 4096
  warmup_repeats: 1
  timed_repeats: 1
sweeps:
  t:
    values: [8, 16, 32, 64, 128]
    output_length: 512
    batch_size: 8
  length:
    values: [128, 512, 1024]
    steps: 64
    batch_size: 8
  batch:
    values: [1, 8, 32]
    steps: 64
    output_length: 512
reporting:
  output_dir: outputs/track6_efficiency
  log_dir: logs/track6_efficiency
  metric_dir: metrics/track6_efficiency
  trajectory_dir: trajectories/track6_efficiency
