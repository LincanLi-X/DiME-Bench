track: track4_reasoning
description: "Track 4 reasoning ability: chaining-style vs planning-style reasoning."
models:
  - configs/models/dllm/llada_8b.yaml
  - configs/models/dllm/llada_1_5.yaml
  - configs/models/dllm/dream_7b.yaml
  - name: DreamOn
    family: dllm
    repo_id: Dream-org/DreamOn
    local_dir: models/checkpoints/dllm/DreamOn
    trust_remote_code: true
    loader: auto
    dtype: bfloat16
    device_map: auto
    use_chat_template: true
    requires_auth: false
    default_max_new_tokens: 512
  - name: TESS2
    family: dllm
    repo_id: TESS-LLM/TESS2
    local_dir: models/checkpoints/dllm/TESS2
    trust_remote_code: true
    loader: auto
    dtype: bfloat16
    device_map: auto
    use_chat_template: true
    requires_auth: false
    default_max_new_tokens: 512
  - configs/models/ar/llama3_8b_instruct.yaml
  - configs/models/ar/gpt2_xl.yaml
  - name: gpt-oss-20b
    family: ar
    repo_id: openai/gpt-oss-20b
    local_dir: models/checkpoints/ar/gpt-oss-20b
    trust_remote_code: true
    loader: causal_lm
    dtype: bfloat16
    device_map: auto
    use_chat_template: true
    requires_auth: false
    default_max_new_tokens: 1024
    reasoning_effort: low
datasets:
  gsm8k:
    repo_id: openai/gsm8k
    subset: main
    split: test
    sample_size: 200
    sample_seed: 42
    task_type: math
    reasoning_type: chaining
    metric: exact_match
    scoring_mode: direct_generation
    max_new_tokens: 256
    prompt_template: prompts/track4_reasoning/gsm8k.txt
    second_ar_baseline: GPT-2-XL
  math_500:
    repo_id: HuggingFaceH4/MATH-500
    subset: null
    split: test
    sample_size: 200
    sample_seed: 42
    task_type: math
    reasoning_type: chaining
    metric: exact_match
    scoring_mode: direct_generation
    max_new_tokens: 512
    prompt_template: prompts/track4_reasoning/math_500.txt
    second_ar_baseline: gpt-oss-20b
  winogrande:
    repo_id: allenai/winogrande
    subset: winogrande_xl
    split: validation
    sample_size: 200
    sample_seed: 42
    task_type: multiple_choice
    reasoning_type: planning
    metric: accuracy
    scoring_mode: direct_generation
    max_new_tokens: 16
    prompt_template: prompts/track4_reasoning/winogrande.txt
    second_ar_baseline: GPT-2-XL
  path_star:
    repo_id: generated:path_star
    subset: null
    split: test
    sample_size: 200
    sample_seed: 42
    task_type: graph_planning
    reasoning_type: planning
    metric: path_validity
    scoring_mode: direct_generation
    max_new_tokens: 128
    prompt_template: prompts/track4_reasoning/path_star.txt
    second_ar_baseline: gpt-oss-20b
    generation_params:
      num_samples: 500
      num_arms: 5
      arm_length: 4
      seed: 42
generation:
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  batch_size: 1
  default_max_new_tokens: 256
  dllm_default_steps: 64
  max_input_tokens: 4096
reporting:
  output_dir: outputs/track4_reasoning
  log_dir: logs/track4_reasoning
  metric_dir: metrics/track4_reasoning
  trajectory_dir: trajectories/track4_reasoning
