track: track1_general
description: "Compact Track 1 sanity check: 6 models x 5 datasets."
models:
  - configs/models/dllm/llada_8b.yaml
  - configs/models/dllm/llada_1_5.yaml
  - configs/models/dllm/dream_7b.yaml
  - configs/models/dllm/diffusellama_7b.yaml
  - configs/models/ar/llama3_8b_instruct.yaml
  - configs/models/ar/gpt2_xl.yaml
datasets:
  mmlu_pro:
    repo_id: TIGER-Lab/MMLU-Pro
    subset: null
    split: test
    sample_size: 200
    sample_seed: 42
    task_type: multiple_choice
    metric: accuracy
    scoring_mode: direct_generation
    max_new_tokens: 16
  gsm8k:
    repo_id: openai/gsm8k
    subset: main
    split: test
    sample_size: 200
    sample_seed: 42
    task_type: math
    metric: exact_match
    scoring_mode: direct_generation
    max_new_tokens: 256
  humaneval:
    repo_id: openai/openai_humaneval
    subset: null
    split: test
    sample_size: null
    sample_seed: 42
    task_type: code
    metric: pass_at_1
    scoring_mode: greedy_generation
    max_new_tokens: 512
    timeout_s: 5
  hellaswag:
    repo_id: Rowan/hellaswag
    subset: null
    split: validation
    sample_size: 200
    sample_seed: 42
    task_type: multiple_choice
    metric: accuracy
    scoring_mode: direct_generation
    max_new_tokens: 16
  ifeval:
    repo_id: google/IFEval
    subset: null
    split: train
    sample_size: 200
    sample_seed: 42
    task_type: instruction_following
    metric: instruction_following_rate
    scoring_mode: greedy_generation
    max_new_tokens: 768
generation:
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  batch_size: 1
  default_max_new_tokens: 256
  dllm_default_steps: 64
reporting:
  output_dir: outputs/track1_general
  log_dir: logs/track1_general
  metric_dir: metrics/track1_general
