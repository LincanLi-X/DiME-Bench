track: track3_editing
description: "Track 3 localized text editing and revision."
models:
  - configs/models/dllm/llada_8b.yaml
  - configs/models/dllm/llada_1_5.yaml
  - configs/models/dllm/dream_7b.yaml
  - configs/models/dllm/diffusellama_7b.yaml
  - configs/models/ar/llama3_8b_instruct.yaml
  - configs/models/ar/gpt2_xl.yaml
additional_models:
  - name: TESS2
    family: dllm
    repo_id: TESS-LLM/TESS2
    local_dir: models/checkpoints/dllm/TESS2
    trust_remote_code: true
    loader: auto
    dtype: bfloat16
    device_map: auto
    use_chat_template: true
    requires_auth: false
    default_max_new_tokens: 512
    status: missing_local_weights
  - name: DreamOn
    family: dllm
    repo_id: Dream-org/DreamOn
    local_dir: models/checkpoints/dllm/DreamOn
    trust_remote_code: true
    loader: auto
    dtype: bfloat16
    device_map: auto
    use_chat_template: true
    requires_auth: false
    default_max_new_tokens: 512
    status: missing_local_weights
  - name: gpt-oss-20b
    family: ar
    repo_id: openai/gpt-oss-20b
    local_dir: models/checkpoints/ar/gpt-oss-20b
    trust_remote_code: true
    loader: causal_lm
    dtype: bfloat16
    device_map: auto
    use_chat_template: true
    requires_auth: false
    default_max_new_tokens: 768
    status: missing_local_weights
dataset_model_policy:
  conll2014_gec:
    second_ar_baseline: GPT-2-XL
  fruit:
    second_ar_baseline: gpt-oss-20b
  synthetic_contradiction_repair:
    second_ar_baseline: GPT-2-XL
datasets:
  conll2014_gec:
    display_name: CoNLL-2014 GEC
    task_type: grammatical_error_correction
    metric: edit_success
    sample_size: 200
    sample_seed: 42
    max_new_tokens: 192
    prompt_template: prompts/track3_editing/conll2014_gec.txt
    raw_paths:
      - data/raw/track3_editing/conll2014_gec.jsonl
      - data/raw/track3_editing/conll2014_gec.tsv
      - data/raw/conll2014_gec.jsonl
      - data/raw/conll2014_gec.tsv
    hf:
      repo_id: null
      subset: null
      split: test
    required_fields:
      source_text:
        - source_text
        - source
        - original
        - input
        - sentence
      reference:
        - reference
        - target
        - corrected
        - output
  fruit:
    display_name: FRUIT
    task_type: evidence_grounded_editing
    metric: edit_success
    sample_size: 200
    sample_seed: 42
    max_new_tokens: 384
    prompt_template: prompts/track3_editing/fruit.txt
    raw_paths:
      - data/raw/track3_editing/fruit.jsonl
      - data/raw/track3_editing/fruit.tsv
      - data/raw/fruit.jsonl
      - data/raw/fruit.tsv
    hf:
      repo_id: null
      subset: null
      split: test
    required_fields:
      source_text:
        - source_text
        - source
        - original_text
        - text
      reference:
        - reference
        - edited_text
        - target
        - output
      evidence:
        - evidence
        - update
        - evidence_text
  synthetic_contradiction_repair:
    display_name: Synthetic contradiction repair
    task_type: contradiction_repair
    metric: edit_success
    sample_size: 200
    sample_seed: 42
    max_new_tokens: 256
    prompt_template: prompts/track3_editing/synthetic_contradiction_repair.txt
    target_marked_prompt_template: prompts/track3_editing/synthetic_target_marked.txt
    synthetic_size: 240
generation:
  temperature: 0.0
  top_p: 1.0
  do_sample: false
  batch_size: 1
  default_max_new_tokens: 256
  dllm_default_steps: 64
  max_input_tokens: 4096
metrics:
  preservation_ngram: 1
  over_edit_multiplier: 1.5
reporting:
  output_dir: outputs/track3_editing
  log_dir: logs/track3_editing
  metric_dir: metrics/track3_editing
  trajectory_dir: trajectories/track3_editing
