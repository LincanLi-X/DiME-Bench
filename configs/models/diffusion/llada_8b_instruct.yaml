id: llada-8b-instruct
family: diffusion
adapter: llada
adapter_version: 1.0.0
name_or_path: GSAI-ML/LLaDA-8B-Instruct
revision: main
tokenizer_revision: main
dtype: bfloat16
device: auto
trust_remote_code: true
capabilities:
  - generate
  - infill
  - edit
  - reasoning
  - denoise
adapter_kwargs:
  use_chat_template: true
  mask_token_id: 126336
  default_steps: 128
  block_length: 32
  schedule: linear
  unmasking_strategy: confidence_based
  temperature: 0.0
  guidance_scale: 0.0
  model_load_kwargs:
    low_cpu_mem_usage: true
