schema_version: "1.0"
id: track1.multiple_choice
version: "1.0.0"
track: track1_general
sample_kind: multiple_choice
semantic:
  instruction: Select exactly one answer option for the supplied question.
  input_fields: [context, question, choices]
  output_contract: Return only the capital letter of the selected option.
  answer_visibility: hidden
templates:
  autoregressive: |-
    Select the best answer. Return only its capital option letter.

    Context:
    {context}

    Question:
    {question}

    Options:
    {choices}

    Answer:
  diffusion: |-
    Solve the following multiple-choice item. Fill the answer field with only one capital option letter.

    [CONTEXT]
    {context}
    [QUESTION]
    {question}
    [OPTIONS]
    {choices}
    [ANSWER]
